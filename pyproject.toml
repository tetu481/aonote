[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aonote"
version = "0.1.0"
description = "Personal Markdown workspace with SQLite FTS5 and an OAuth-protected MCP server"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1",
  "python-multipart>=0.0.32,<1",
  "uvicorn[standard]>=0.52.1,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=9.0.3,<10",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
aonote = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
